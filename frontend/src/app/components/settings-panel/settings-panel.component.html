<div class="settings-panel">
  <button class="settings-toggle" (click)="toggle()" type="button">
    <lucide-icon [img]="Settings2" [size]="15" [strokeWidth]="2"></lucide-icon>
    <span class="toggle-label">API Credentials</span>

    <div class="status-pills">
      @if (!credentials.igdbConfigured()) {
        <span class="pill warn">
          <lucide-icon [img]="XCircle" [size]="12" [strokeWidth]="2"></lucide-icon>
          IGDB not set
        </span>
      } @else if (credentials.aiEnabled()) {
        <span class="pill ok">
          <lucide-icon [img]="CheckCircle2" [size]="12" [strokeWidth]="2"></lucide-icon>
          AI enabled
        </span>
      } @else {
        <span class="pill partial">
          <lucide-icon [img]="Minus" [size]="12" [strokeWidth]="2"></lucide-icon>
          Filters only
        </span>
      }
    </div>

    <lucide-icon [img]="ChevronDown" [size]="15" [strokeWidth]="2" class="chevron" [class.open]="open()"></lucide-icon>
  </button>

  @if (open()) {
    <div class="settings-body">
      <p class="hint">Credentials are stored in your browser only and sent directly to the API on each request.</p>

      <div class="field">
        <label>Twitch Client ID <span class="req">*</span></label>
        <input [(ngModel)]="igdbClientId" type="text" autocomplete="off" placeholder="Required for all searches" />
      </div>

      <div class="field">
        <label>Twitch Client Secret <span class="req">*</span></label>
        <input [(ngModel)]="igdbClientSecret" type="password" autocomplete="off" placeholder="Required for all searches" />
      </div>

      <div class="field">
        <label>OpenAI API Key <span class="opt">optional</span></label>
        <input [(ngModel)]="openaiKey" type="password" autocomplete="off" placeholder="Enables AI-powered semantic search" />
      </div>

      <div class="footer">
        <button class="save-btn" (click)="onSave()" type="button" [disabled]="!igdbClientId || !igdbClientSecret">
          {{ saved() ? 'Saved ✓' : 'Save credentials' }}
        </button>
      </div>
    </div>
  }
</div>
