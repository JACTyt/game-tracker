@if (options()) {
  <div class="filter-panel">
    <button class="filter-header" (click)="toggleCollapsed()" type="button">
      <lucide-icon [img]="SlidersHorizontal" [size]="14" [strokeWidth]="2"></lucide-icon>
      <span>Filters</span>
      @if (activeCount() > 0) {
        <span class="active-badge">{{ activeCount() }}</span>
      }
      <lucide-icon [img]="ChevronDown" [size]="14" [strokeWidth]="2" class="chevron" [class.open]="!collapsed()"></lucide-icon>
    </button>

    <div class="panel-collapse" [class.open]="!collapsed()">
      <div class="panel-collapse-inner">
        <div class="filter-body">
          @for (g of groups; track g.key) {
            <div class="filter-group">
              <button class="group-header" (click)="toggleGroup(g.key)" type="button">
                <lucide-icon [img]="g.icon" [size]="13" [strokeWidth]="2"></lucide-icon>
                <span>{{ g.label }}</span>
                @if (selectedCount(g.key) > 0) {
                  <span class="group-badge">{{ selectedCount(g.key) }}</span>
                }
                <lucide-icon [img]="ChevronDown" [size]="14" [strokeWidth]="2" class="chevron" [class.open]="groupOpen()[g.key]"></lucide-icon>
              </button>

              <div class="group-collapse" [class.open]="groupOpen()[g.key]">
                <div class="group-collapse-inner">
                  <div class="filter-chips">
                    @for (item of groupItems(g.key); track item.id) {
                      <button [class.active]="isActive(g.key, item.name)" (click)="toggleItem(g.key, item.name)" type="button">
                        {{ item.name }}
                      </button>
                    }
                  </div>
                </div>
              </div>
            </div>
          }

          <!-- Release Year -->
          <div class="filter-group">
            <button class="group-header" (click)="toggleYears()" type="button">
              <lucide-icon [img]="Calendar" [size]="13" [strokeWidth]="2"></lucide-icon>
              <span>Release Year</span>
              @if (yearActive()) { <span class="group-badge">•</span> }
              <lucide-icon [img]="ChevronDown" [size]="14" [strokeWidth]="2" class="chevron" [class.open]="yearsOpen()"></lucide-icon>
            </button>

            <div class="group-collapse" [class.open]="yearsOpen()">
              <div class="group-collapse-inner">
                <div class="year-range">
                  <input
                    class="year-input" type="number" inputmode="numeric" placeholder="From"
                    [value]="filters.year_min ?? ''"
                    (input)="setYear('min', $any($event.target).value)"
                  />
                  <span class="year-dash">–</span>
                  <input
                    class="year-input" type="number" inputmode="numeric" placeholder="To"
                    [value]="filters.year_max ?? ''"
                    (input)="setYear('max', $any($event.target).value)"
                  />
                </div>
              </div>
            </div>
          </div>

          @if (hasAnyFilter()) {
            <button class="clear-all" (click)="clearAll($event)" type="button">
              <lucide-icon [img]="RotateCcw" [size]="12" [strokeWidth]="2"></lucide-icon>
              Clear all filters
            </button>
          }
        </div>
      </div>
    </div>
  </div>
}
