<div class="search-bar">
  <div class="mode-toggle">
    <button
      [class.active]="mode() === 'filter'"
      (click)="setMode('filter')"
      type="button">
      <lucide-icon [img]="SlidersHorizontal" [size]="15" [strokeWidth]="2"></lucide-icon>
      Use filters
    </button>
    <button
      [class.active]="mode() === 'semantic'"
      (click)="setMode('semantic')"
      [disabled]="!aiEnabled()"
      [title]="aiEnabled() ? '' : 'Add your OpenAI API key in settings to enable AI search'"
      type="button">
      <lucide-icon [img]="Sparkles" [size]="15" [strokeWidth]="2"></lucide-icon>
      Describe it
      @if (!aiEnabled()) { <span class="ai-lock">AI</span> }
    </button>
  </div>

  <form (ngSubmit)="onSubmit()" class="search-form">
    <textarea
      #textarea
      [(ngModel)]="query"
      name="query"
      rows="1"
      [placeholder]="mode() === 'semantic'
        ? 'e.g. a dark fantasy RPG from the 2000s where you play a thief...'
        : 'Search by title or keyword...'"
      [disabled]="loading()"
      autocomplete="off"
      (input)="onInput()"
      (keydown)="onKeydown($event)"
    ></textarea>
    <button type="submit" [disabled]="loading() || !query.trim()">
      @if (loading()) {
        <span class="spinner"></span>
      } @else {
        <lucide-icon [img]="Search" [size]="17" [strokeWidth]="2.5"></lucide-icon>
      }
    </button>
  </form>
</div>
