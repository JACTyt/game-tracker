<div class="app">
  <header>
    <div class="logo">
      <div class="logo-icon">
        <lucide-icon [img]="Gamepad2" [size]="22" [strokeWidth]="2"></lucide-icon>
      </div>
      <h1>GameVault</h1>
    </div>
    <p>Describe the game you remember — we'll find it.</p>
  </header>

  <app-settings-panel />

  @if (credentials.igdbConfigured()) {
    <div
      class="workspace"
      [class.no-left]="!showLeftPane()"
      [style.--left-w]="leftWidth() + 'px'"
      [style.--right-w]="rightWidth() + 'px'"
    >
      @if (showLeftPane()) {
        <aside class="pane pane-left">
          <app-filter-panel
            [options]="filterOptions()"
            (filtersChanged)="onFiltersChanged($event)"
          />
        </aside>
        <div class="resizer" (mousedown)="startResize('left', $event)" title="Drag to resize"></div>
      }

      <section class="pane pane-center">
        <app-search-bar
          [mode]="mode()"
          [loading]="loading()"
          [aiEnabled]="credentials.aiEnabled()"
          [queryValue]="searchQuery()"
          (searched)="onSearch($event)"
          (modeChanged)="onModeChanged($event)"
        />

        <app-recent-searches (selected)="onRecentSelected($event)" />

        @if (errorMsg()) {
          <div class="error-banner" role="alert">
            <lucide-icon [img]="TriangleAlert" [size]="16" [strokeWidth]="2"></lucide-icon>
            <span>{{ errorMsg() }}</span>
          </div>
        }

        <app-results-list
          [results]="results()"
          [extractedFilters]="extractedFilters()"
          [loading]="loading()"
          [hasSearched]="hasSearched()"
          [aiEnabled]="credentials.aiEnabled()"
          (moreLikeThis)="onMoreLikeThis($event)"
        />
      </section>

      <div class="resizer" (mousedown)="startResize('right', $event)" title="Drag to resize"></div>
      <aside class="pane pane-right">
        <app-vault-shelf />
      </aside>
    </div>
  } @else {
    <div class="no-credentials">
      Configure your API credentials above to start searching.
    </div>
  }

  <app-compare-tray />
</div>
